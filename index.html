<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2a0a16">
<title>石榴人 3D · 梁梦冉</title>
<meta name="description" content="给梁梦冉的 3D 石榴人：拖动环绕、缩放观看，背景是流动的抽象光场。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='19' r='11' fill='%23d8394a'/%3E%3Cpath d='M11 9 L16 3 L21 9 Z' fill='%23a8323c'/%3E%3Ccircle cx='12' cy='18' r='3.2' fill='%23fff'/%3E%3Ccircle cx='20' cy='18' r='3.2' fill='%23fff'/%3E%3Ccircle cx='12.4' cy='18.4' r='1.7' fill='%23211620'/%3E%3Ccircle cx='20.4' cy='18.4' r='1.7' fill='%23211620'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<canvas id="stage" aria-label="3D 石榴人互动场景"></canvas>

<!-- 加载遮罩 -->
<div id="loader" class="loader">
  <div class="loader-inner">
    <div class="peel"></div>
    <p class="loader-text">正在剥开石榴…</p>
  </div>
</div>

<!-- 角标 -->
<div class="hud hud-tl">
  <h1>石榴人 <span>3D</span></h1>
  <p class="hud-owner">送给 <b>梁梦冉</b> · 专属 3D 小站</p>
  <p class="sub">拖动环绕 · 滚轮 / 捏合缩放 · 点击它有惊喜</p>
</div>

<div class="hud hud-bl" id="hint">
  <span class="k">拖拽</span> 环绕
  <span class="k">滚轮</span> 缩放
  <span class="k">点击</span> 互动
  <span class="k">空格</span> 暂停
  <span class="k">T</span> 换背景
  <span class="k">N</span> 铭牌
</div>

<!-- 工具栏 -->
<div class="toolbar">
  <button id="btn-rotate" class="tbtn on" title="暂停 / 继续自动旋转（空格）">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4V1L8 5l4 4V6a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
    <span>自转</span>
  </button>
  <button id="btn-plate" class="tbtn on" title="显示 / 隐藏头顶名字铭牌（N）">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-6l-2.6 3.2a.5.5 0 0 1-.8 0L8 16H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm3.5 5.2a1.3 1.3 0 1 0 0-2.6 1.3 1.3 0 0 0 0 2.6zm9 0a1.3 1.3 0 1 0 0-2.6 1.3 1.3 0 0 0 0 2.6zM8 12.4c1 1.1 2.4 1.6 4 1.6s3-.5 4-1.6l-1.1-1c-.7.7-1.7 1.1-2.9 1.1s-2.2-.4-2.9-1.1L8 12.4z"/></svg>
    <span>铭牌</span>
  </button>
  <button id="btn-theme" class="tbtn" title="切换背景主题（T）">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.2 0-1.1.9-2 2-2h2.3A4.7 4.7 0 0 0 22 9.8C22 6 17.5 3 12 3zM6.5 12A1.5 1.5 0 1 1 8 10.5 1.5 1.5 0 0 1 6.5 12zm3-4A1.5 1.5 0 1 1 11 6.5 1.5 1.5 0 0 1 9.5 8zm5 0A1.5 1.5 0 1 1 16 6.5 1.5 1.5 0 0 1 14.5 8zm3.5 4A1.5 1.5 0 1 1 19.5 10.5 1.5 1.5 0 0 1 18 12z"/></svg>
    <span>背景</span>
  </button>
  <button id="btn-reset" class="tbtn" title="复位视角（R）">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
    <span>复位</span>
  </button>
  <button id="btn-shot" class="tbtn" title="保存当前画面为 PNG">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3 7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9zm3 5.5A5.5 5.5 0 1 1 6.5 14 5.5 5.5 0 0 1 12 8.5zm0 2A3.5 3.5 0 1 0 15.5 14 3.5 3.5 0 0 0 12 10.5z"/></svg>
    <span>截图</span>
  </button>
</div>

<div id="toast" class="toast"></div>

<!-- 兜底：WebGL 不可用 / 模块加载失败 -->
<div id="fallback" class="fallback" hidden>
  <div class="fallback-box">
    <h2>这个浏览器没能启动 3D 场景</h2>
    <p>可能是浏览器不支持 WebGL，或文件是通过 <code>file://</code> 直接打开的。</p>
    <p>请用本地服务器打开本目录，例如在文件夹里执行：</p>
    <pre>python3 -m http.server 8000</pre>
    <p>然后访问 <code>http://localhost:8000</code>。</p>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js"
  }
}
</script>
<script type="module">
  const loader = document.getElementById('loader');
  const fallback = document.getElementById('fallback');

  // 环境自检：file:// 协议下 ES module 会被 CORS 拦，提前给出人话提示
  if (location.protocol === 'file:') {
    document.getElementById('loader').style.display = 'none';
    fallback.hidden = false;
  } else {
    import('./src/main.js')
      .then(() => {
        window.__pomegranateReady = true;
        setTimeout(() => loader.classList.add('done'), 260);
        setTimeout(() => loader.remove(), 1200);
      })
      .catch((err) => {
        console.error('[pomegranate] 启动失败：', err);
        loader.classList.add('done');
        fallback.hidden = false;
        const box = fallback.querySelector('.fallback-box');
        if (box) {
          const pre = document.createElement('p');
          pre.className = 'err';
          pre.textContent = '错误详情：' + (err && err.message ? err.message : String(err));
          box.appendChild(pre);
        }
      });
  }
</script>
</body>
</html>
